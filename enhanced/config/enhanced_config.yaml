# ENHANCED Configuration — SHARP v2
# Targets: beat Siddhart's fused pipeline (81% recall, 99.8% precision, 0.14 FPs/frame)
# Strategy: camera-agnostic physics-based gates instead of trained camera-specific TinyNet

model:
  weights: "yolofinetune/models/yolo/finetuned/best.pt"
  imgsz: 640          # back to 640 for real-time FPS — CMC + peak_conf handle quality
  conf: 0.10          # lowered: v11s detects real FODs at 0.10-0.35, not 0.25+
  device: "cuda"

roi:
  top_crop: 0.50
  bot_crop: 0.05
  left_crop: 0.00
  right_crop: 0.00

tracker:
  confirm_frames: 4
  small_confirm_frames: 4   # raised with confirm_frames
  small_area_px: 1000
  iou_threshold: 0.25       # back to 0.25 — CMC compensates for movement drift
  max_miss: 2
  max_dist_frac: 0.05
  # Peak confidence gate — NEW in ENHANCED
  # A track only confirms if it has seen at least ONE frame with conf >= this value.
  # Runway noise fires weakly at 0.25-0.28 across all frames.
  # Real FOD grows in confidence as the camera closes in — it will cross this threshold.
  # CMC keeps small FOD tracks alive long enough for confidence to build.
  peak_conf_min: 0.30       # lowered from 0.42 — v11s FODs peak at 0.25-0.44 on this camera
  conf_growth_min: 0.08     # lowered from 0.12 — growth still required, just less aggressive
                            # Real FOD confidence grows as camera approaches.
                            # Runway cracks/textures fire at flat confidence — rejected.
  # Camera motion compensation
  camera_compensation: true
  comp_max_corners: 200
  comp_quality: 0.01
  comp_min_distance: 30

post_filter:
  min_box_area: 64
  max_box_fraction: 0.25
  min_aspect: 0.15
  max_aspect: 6.0
  # FOD alert class whitelist — ONLY these class indices trigger unique FOD alerts.
  # Classes: 0=bolt, 1=foreign object, 2=oil marks, 3=runway damage, 4=runway line, 5=tire marks
  # runway line (4) and runway damage (3) are detected but NEVER count as FOD.
  fod_alert_classes: [0, 1]          # bolt, foreign object ONLY — runway line/damage/tiremark never alert
  # Patch contrast gate — inspired by Siddhart's TinyNet but camera-agnostic
  # Michelson contrast: |mean_inner - mean_border| / (mean_inner + mean_border)
  # Real FOD (bolt, nail, wire) has measurable contrast vs surrounding runway pixels.
  # Runway texture false flags blend into surroundings — contrast ~0.0.
  # Range: 0.0 (no contrast) to 1.0 (maximum contrast).
  # Tune down if catching real FOD is missed; tune up to kill more false flags.
  patch_contrast_min: 0.05
  contrast_margin_px: 12    # px border around bbox sampled as background

output:
  extract_fps: 2.0
  draw_roi_lines: true
  box_color_bgr: [0, 255, 180]   # cyan-green — distinct from SHARP orange
  label_confirmed: true

logging:
  verbose: false
