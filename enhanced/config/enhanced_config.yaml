# ENHANCED Configuration — SHARP v2
# Targets: beat Siddhart's HAWKEYE (76.2% recall, 0.928 precision, 27.6fps)

model:
  weights: "yolofinetune/models/yolo/finetuned/best.pt"
  imgsz: 640          # back to 640 for real-time FPS — CMC + peak_conf handle quality
  conf: 0.25
  device: "cuda"

roi:
  top_crop: 0.50
  bot_crop: 0.05
  left_crop: 0.00
  right_crop: 0.00

tracker:
  confirm_frames: 4
  small_confirm_frames: 4   # raised with confirm_frames
  small_area_px: 1000
  iou_threshold: 0.25       # back to 0.25 — CMC compensates for movement drift
  max_miss: 2
  max_dist_frac: 0.05
  # Peak confidence gate — NEW in ENHANCED
  # A track only confirms if it has seen at least ONE frame with conf >= this value.
  # Runway noise fires weakly at 0.25-0.28 across all frames.
  # Real FOD grows in confidence as the camera closes in — it will cross this threshold.
  # CMC keeps small FOD tracks alive long enough for confidence to build.
  peak_conf_min: 0.42       # raised from 0.35 — cuts flat-confidence surface noise
  conf_growth_min: 0.08     # NEW: peak_conf must exceed initial_conf by this margin
                            # Real FOD confidence grows as camera approaches.
                            # Runway cracks/textures fire at flat confidence — rejected.
  # Camera motion compensation
  camera_compensation: true
  comp_max_corners: 200
  comp_quality: 0.01
  comp_min_distance: 30

post_filter:
  min_box_area: 64
  max_box_fraction: 0.25
  min_aspect: 0.15
  max_aspect: 6.0

output:
  extract_fps: 2.0
  draw_roi_lines: true
  box_color_bgr: [0, 255, 180]   # cyan-green — distinct from SHARP orange
  label_confirmed: true

logging:
  verbose: false
