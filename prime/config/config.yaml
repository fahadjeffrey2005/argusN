device: cuda

camera:
  input_mode: video_file
  video_file_path: data/raw/videos/recording.mp4
  fps: 30

yolo:
  model_path: models/yolo/finetuned/best.pt
  confidence_threshold: 0.28   # tuned on static footage — same as HAWKEYE
  iou_threshold: 0.45
  input_size: 640

tracker:
  confirm_frames: 3            # final confirmation gate
  iou_threshold: 0.25
  max_miss_frames: 2
  prefilter_frames: 2          # 2-frame prefilter for slow-path candidates

cnn:
  model_path: models/cnn/prime_classifier.pth
  input_size: 128
  channels: 4
  num_classes: 5
  class_names: [fod, shadow, runway_marking, strobe_light, clean_tarmac]
  fod_class_id: 0
  # Hard-reject floor: only drop a candidate when CNN is fairly confident
  # it is NOT FOD.  Deliberately low — let the tracker handle ambiguity.
  confidence_threshold: 0.25
  # Fast-path: skip 2-frame prefilter, enter 3-frame tracker directly
  fast_path_threshold: 0.90
  epochs: 30
  batch_size: 32
  learning_rate: 0.0005
  early_stopping_patience: 5

flow:
  residual_threshold: 2.5
  min_anomaly_area_px: 10
  max_anomaly_area_px: 50000

imu:
  enabled: false
  simulated_speed_kmh: 30.0

egomotion:
  camera_height_m: 0.325
  focal_length_px: 1200.0

pipeline:
  top_crop: 0.50    # cut top half — distant runway, shadows, gradients
  bot_crop: 0.05

data:
  # clean1.mp4 hard split — NEVER CROSS THIS BOUNDARY
  # Frames 0..6299   (0–209s @ 30fps)  → crop collection / CNN training
  # Frames 6300+     (210s–end)        → FP rate evaluation only
  clean_split_frame: 6300

outputs:
  detections_path: outputs/detections
  alerts_path: outputs/alerts

logging:
  log_path: logs/prime.log
  level: INFO
